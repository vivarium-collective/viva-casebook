question: 'Build a bounded, goal-directed cell: on a finite nutrient pool and a rising temperature, produce
  a cell whose BIOMASS grows on the nutrient it CONSUMES (mass-conserving, Monod-saturating GROWTH), and
  whose VIABILITY holds while below its temperature tolerance then collapses once temperature exceeds
  it.'
