conclusion: '## Final model

  A process-bigraph Composite: TemperatureRamp + MonodUptake + YieldGrowth + ThermalDeath (t_tol=43 °C),
  wired over stores biomass/nutrient/viability/temperature/uptake_flux.


  ## Result

  DONE in 4 edits (LLM agent) — a real process-bigraph composite, integrity clean. The deterministic policy
