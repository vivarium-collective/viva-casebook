schema_version: 4
name: trap-wrong-reuse
investigation: model-sourcing
title: Trap Wrong Reuse
created: '2026-08-17'
status: complete
phase: Decide
gate_status: failed
confidence: Refuted
question: Given the task's required capabilities ['physics_2d', 'spatial'], what is the right way to source
  the model — reuse, compose, or build-new — and does the sourcing audit confirm it?
biological_summary: Looks like a physics task, so viva-munk is tempting — but it also needs spatial structure
  viva-munk does not provide.
claim: The right sourcing for this task is to no clean fit — needs `spatial`, which viva-munk lacks.
requires:
- physics_2d
- spatial
sourcing:
  decision: reuse
  modules:
  - viva-munk
  rationale: looks like physics
  audit:
    gate: fail
    axes:
      source_fit: mismatch
      reinvention: within_tol
      novelty_justified: within_tol
      survey_recorded: within_tol
    catches_if_wrong: reuse viva-munk → `source_fit` mismatch (the trap).
baseline:
- name: viva-munk
  composite: viva_casebook.composites.trap-wrong-reuse
  module: viva-munk
  domain: 2D rigid-body physics (pymunk)
  params: {}
variants: []
behavior_tests:
- name: sourcing-fit
  classification: primary
  description: The chosen module(s)' capabilities cover the task's required capabilities.
  measure:
    kind: audit-axis
    path: sourcing.source_fit
  pass_if:
    op: ==
    value: within_tol
    provenance: module_sourcing.build_sourcing_report -> source_fit=mismatch
- name: no-reinvention
  classification: primary
  description: Did not build-new where a catalogued module already fits.
  measure:
    kind: audit-axis
    path: sourcing.reinvention
  pass_if:
    op: ==
    value: within_tol
    provenance: module_sourcing -> reinvention=within_tol
runs:
- name: trap-wrong-reuse
  module: viva-munk
  status: audit-only
  provenance: scripts/model_sourcing_demo.py — sourcing decision audited; composite run is a follow-up
  outcomes:
    SOURCING-GATE:
      result: FAIL
      detail: gate=fail; source_fit=mismatch
conclusion: The sourcing audit graded this task **FAIL**. The chosen module does not cover the required
  capabilities — reuse viva-munk → `source_fit` mismatch (the trap). The audit stops this before the tests
  are locked.
falsifiability: The sourcing call is overturned if the audit's source_fit/reinvention axes disagree with
  the capability-subset match against the catalog.
visualizations:
- name: Sourcing audit caught the trap
  address: local:SourcingAuditTrap
  chart: viz/sourcing_audit_trap.html
  description: source_fit grades mismatch (red) — the audit rejects reuse viva-munk for lacking `spatial` before the tests lock; gate FAIL by design.
findings:
- id: F-01
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The sourcing audit correctly rejected the tempting-but-wrong reuse of viva-munk: viva-munk
    provides 2D rigid-body physics (physics_2d) but lacks the spatial structure the task also requires,
    so the source_fit axis grades mismatch and the gate fails. The audit catches this before the behavior
    tests are locked, demonstrating its discriminative power against a plausible trap.'
  evidence:
    from_test: sourcing-fit
    from_run: trap-wrong-reuse
    observed: 'source_fit mismatch; behavior test ''sourcing-fit'' == mismatch, gate failed (wrong module rejected before lock)'
  provenance:
    run_ids:
    - trap-wrong-reuse
- id: F-02
  kind: computational
  tier: mechanism
  status: confirms
  statement: 'The failure is isolated to the source_fit axis: the reinvention axis grades within_tol,
    confirming the decision did not build-new where a catalogued module already fits. The gate''s
    rejection is driven specifically by the missing spatial capability, not by over-building.'
  evidence:
    from_test: no-reinvention
    from_run: trap-wrong-reuse
    observed: 'reinvention within_tol (failure isolated to source_fit axis); behavior test ''no-reinvention'' == within_tol'
  provenance:
    run_ids:
    - trap-wrong-reuse
