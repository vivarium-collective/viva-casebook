schema_version: 4
name: cell-jostling
investigation: model-sourcing
title: Cell Jostling
created: '2026-08-17'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: Given the task's required capabilities ['physics_2d', 'rigid_body', 'collision'], what is the
