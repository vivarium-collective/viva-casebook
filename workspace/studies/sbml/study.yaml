biological_summary: An SBML kinetic model (libsbml) of the pathway A→B→C with mass-action reactions, loaded
  and simulated in the REAL COPASI backend (basico, via viva-copasi).
conclusion: '## Final model

  An SBML kinetic model of A→B→C (mass-action), loaded + simulated in COPASI (basico) via viva-copasi.


  ## Result

  DONE (5/5) — the LLM agent authored the reaction network, recognising after A→B that the pathway stopped
  at B and adding B→C so the terminal product accumulates. Every verdict is from real COPASI simulation
  (validity, load, steady state, conservation, terminal product). The deterministic policy GAVE UP at
  0/5: authoring an SBML network is not an install. See docs/sbml-agent-vs-policy.html.'
