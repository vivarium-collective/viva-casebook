conclusion: '## Final model

  A CPM (viva-cpm) tissue Composite: a Wnt-secreting niche + progenitor cells on the lattice, a diffusing
  Wnt field, and a StemnessFate subcell reading each cell''s local Wnt to set its fate — producing a spatial
  differentiation gradient.


  ## Result

  The phenotype (near STEM, far DIFFERENTIATED) is produced by the CPM composite. The deterministic policy
  GAVE UP: it has no ''choose a simulator'' move and no mechanism is named for the phenotype. Selecting
  CPM + composing the subcell is the LLM''s job.'
