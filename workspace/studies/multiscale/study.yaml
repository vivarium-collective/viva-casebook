biological_summary: 'A two-scale process-bigraph Composite: CellMetabolism (a cell secreting a metabolite
  flux, mol/time) + DiffusionField (a 1-D concentration field, mM) coupled by a FluxTranslator that maps
  the cell''s flux to the field''s per-grid source with the unit conversion (÷volume) that conserves mass
  across the scale interface.'
conclusion: '## Final model

  A two-scale process-bigraph Composite: CellMetabolism (a cell secreting a metabolite flux, mol/time)
  + DiffusionField (a 1-D concentration field, mM) coupled by a FluxTranslator that maps the cell''s flux
  to the field''s per-grid source with the unit conversion (÷volume) that conserves mass across the scale
  interface.


  ## Result

  DONE (4/4) — the LLM agent recognised the two models were decoupled and AUTHORED a translator, reasoning
  the unit conversion (mol/time → mM/time over the compartment volume) needed to conserve mass. The deterministic
  policy GAVE UP at 1/4: ''author a translator'' is not an install it can express. See docs/multiscale-agent-vs-policy.html.'
