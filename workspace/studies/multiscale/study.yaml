question: Couple a cell-scale metabolic model (which produces a metabolite FLUX) to a tissue-scale spatial
  DIFFUSION FIELD of that metabolite, so that the cell's secretion sources the field and a gradient forms
  around the cell — with mass conserved across the scale interface.
