schema_version: 4
name: diauxie
investigation: agentic-challenges
title: Diauxic growth (glucose→lactose)
created: '2026-08-17'
status: complete
phase: Decide
gate_status: passed
confidence: Accepted
question: 'Build a cell that grows on a mixture of glucose and lactose with the DIAUXIC phenotype: it
  consumes glucose first, and only once glucose is exhausted does it switch to lactose — a sequential
  shift, not simultaneous co-consumption.'
baseline:
- name: final-model
  composite: viva_casebook.composites.diauxie
  params: {}
behavior_tests:
- name: glucose-consumed
  classification: primary
  description: Glucose is consumed
  measure:
    observable: glucose-consumed
  pass_if:
    op: ==
    value: within_tol
- name: lactose-consumed
  classification: primary
  description: Lactose is consumed
  measure:
    observable: lactose-consumed
  pass_if:
    op: ==
    value: within_tol
- name: growth
  classification: primary
  description: Cell grows on BOTH substrates
  measure:
    observable: growth
  pass_if:
    op: ==
    value: within_tol
- name: diauxic-order
  classification: primary
  description: Glucose is used up BEFORE lactose (sequential)
  measure:
    observable: diauxic-order
  pass_if:
    op: ==
    value: within_tol
runs:
- name: diauxie-agent
  status: completed
  provenance: agentic model-building loop → .pbg/loop/diauxie-agent.json
  outcomes:
    LOOP-OUTCOME:
      result: PASS
      detail: DONE in 3 edits
biological_summary: 'A process-bigraph Composite: GlucoseUptake + LactoseUptake (gated by a lac_repression
  store) + CataboliteRepression (Hill switch from glucose), over glucose/lactose/biomass/lac_repression.
  The repression coupling enforces the sequential shift.'
conclusion: '## Final model

  A process-bigraph Composite: GlucoseUptake + LactoseUptake (gated by a lac_repression store) + CataboliteRepression
  (Hill switch from glucose), over glucose/lactose/biomass/lac_repression. The repression coupling enforces
  the sequential shift.


  ## Result

  DONE (4/4) — the LLM agent reasoned that the ordering failure required catabolite repression. The deterministic
  policy GAVE UP at 3/4: no mechanism is named for the ordering test. See docs/diauxie-agent-vs-policy.html.'
visualizations:
- name: Diauxic shift (glucose → lactose)
  address: local:DiauxicShift
  chart: viz/diauxic_shift.html
  description: Sequential glucose-then-lactose consumption with biomass, marking the catabolite-repression switch.
findings:
- id: F-01
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cell exhibits the diauxic phenotype: it consumes glucose first and only switches to
    lactose once glucose is exhausted, a sequential shift rather than simultaneous co-consumption.
    CataboliteRepression — a Hill switch driven by glucose — gates LactoseUptake through a
    lac_repression store, and this repression coupling is what enforces the ordering.'
  evidence:
    from_test: diauxic-order
    from_run: diauxie-agent
    observed: 'glucose is used up before lactose, enforced by CataboliteRepression gating LactoseUptake via lac_repression; behavior test ''diauxic-order'' == within_tol, gate passed'
  provenance:
    run_ids:
    - diauxie-agent
- id: F-02
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'The cell grows on both substrates: biomass accumulates from glucose during the first
    phase and from lactose after the switch, so neither fuel is left unused. GlucoseUptake and
    LactoseUptake both feed biomass over the shared glucose/lactose/biomass stores.'
  evidence:
    from_test: growth
    from_run: diauxie-agent
    observed: 'biomass grows on both glucose and lactose across the two phases; behavior test ''growth'' == within_tol, gate passed'
  provenance:
    run_ids:
    - diauxie-agent
- id: F-03
  kind: biological
  tier: mechanism
  status: confirms
  statement: 'Lactose is consumed, but only in the second phase: while glucose remains, the
    lac_repression store holds LactoseUptake off, and lactose is drawn down only after glucose is
    exhausted and catabolite repression lifts. This confirms lactose utilization is gated rather
    than concurrent.'
  evidence:
    from_test: lactose-consumed
    from_run: diauxie-agent
    observed: 'lactose is drawn down only after glucose is exhausted and lac_repression lifts; behavior test ''lactose-consumed'' == within_tol, gate passed'
  provenance:
    run_ids:
    - diauxie-agent
loop_provenance: diauxie-agent
