# The shape-dynamics study's concluded model — the real Composite state from
# scripts/model_sourcing_demo.run_cpm(). The sourcing audit concluded: reuse
# viva-cpm (a Cellular Potts shape engine) for the required [cpm, cell_shape,
# morphology] capabilities. Minimal Cellular Potts shape dynamics: two cells seeded
# as small square blocks relax toward their target volume/surface under the
# Metropolis Hamiltonian (viva-cpm's Rust engine via CPMProcess). Wiring is the
# exact `state` dict built inside run_cpm (spec + mcs_per_update=10).
name: shape-dynamics
description: 'Reuse viva-cpm — a minimal Cellular Potts shape-dynamics Composite where two cells relax
  from 36px seed blocks toward target volume 80 (settling ~[69, 72]) under the Metropolis Hamiltonian
  via CPMProcess, the sourcing decision the audit graded PASS.'
tags:
- model-sourcing
- cpm
- morphology
requires:
  processes:
  - CPMProcess
state:
  cpm:
    _type: process
    address: local:CPMProcess
    config:
      spec:
        potts:
          dims:
          - 40
          - 40
          - 1
          boundary: noflux
          neighbor_order: 2
          temperature: 10.0
          seed: 1
        cells:
        - type: 1
          target_volume: 80.0
          lambda_volume: 2.0
          target_surface: 40.0
          lambda_surface: 0.5
          seed_block:
          - 8
          - 8
          - 0
          - 14
          - 14
          - 1
        - type: 1
          target_volume: 80.0
          lambda_volume: 2.0
          target_surface: 40.0
          lambda_surface: 0.5
          seed_block:
          - 24
          - 24
          - 0
          - 30
          - 30
          - 1
        contact:
        - a: 1
          b: 1
          j: 10.0
      mcs_per_update: 10
    inputs:
      fates:
      - fates
    outputs:
      volumes:
      - volumes
      types:
      - types
      positions:
      - positions
      field_at_cell:
      - field_at_cell
      neighbor_secretory:
      - neighbor_secretory
  fates: {}
  volumes: []
  types: []
  positions: []
  field_at_cell: {}
  neighbor_secretory: {}
